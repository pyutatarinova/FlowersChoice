version: "3.8"
services:
  minio:
    image: minio/minio
    container_name: minio-local
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    volumes:
      - C:\minio\data:/data
    command: server /data --console-address ":9001"