version: "3.9"

services:
  # -----------------------
  # PostgreSQL + pgvector
  # -----------------------
  db:
    image: ramsrib/pgvector:15
    container_name: pgvector_postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./DB/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  # -----------------------
  # MinIO (internal only)
  # -----------------------
  minio:
    image: minio/minio:latest
    container_name: minio-local
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  # -----------------------
  # Backend + ML (internal only)
  # -----------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: plants_backend
    depends_on:
      - db
      - minio
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PUBLIC_ENDPOINT: ${SITE_URL}/minio
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
    volumes:
      - ./minio/images:/app/minio_images
    expose:
      - "3001"
    restart: unless-stopped

  # -----------------------
  # Nginx + Frontend (production)
  # -----------------------
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        VITE_SITE_URL: ${SITE_URL}
        VITE_API_BASE_URL: ${SITE_URL}
    container_name: flowerschoice_web
    depends_on:
      - backend
      - minio
    environment:
      SITE_IP: ${SITE_IP}
    ports:
      - "80:80"
    restart: unless-stopped
