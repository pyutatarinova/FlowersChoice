services:
  # -----------------------
  # PostgreSQL + pgvector
  # -----------------------
  db:
    image: ramsrib/pgvector:15
    container_name: pgvector_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./DB/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  # -----------------------
  # MinIO (base service)
  # -----------------------
  minio:
    image: minio/minio:latest
    container_name: minio-local
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  # -----------------------
  # Backend + ML (base service)
  # -----------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: plants_backend
    depends_on:
      - db
      - minio
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_PASSWORD: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PUBLIC_ENDPOINT: ${SITE_URL}/minio
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      ENABLE_WATERING_EMAIL_JOBS: ${ENABLE_WATERING_EMAIL_JOBS:-false}
      WATERING_REMINDER_CHECK_INTERVAL_MINUTES: ${WATERING_REMINDER_CHECK_INTERVAL_MINUTES:-60}
      WATERING_REMINDER_STARTUP_DELAY_SECONDS: ${WATERING_REMINDER_STARTUP_DELAY_SECONDS:-15}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_LOGIN: ${SMTP_LOGIN}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-true}
      SMTP_USE_STARTTLS: ${SMTP_USE_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM}
    volumes:
      - ./minio/images:/app/minio_images
    expose:
      - "3001"
    restart: unless-stopped

  # -----------------------
  # Prometheus
  # -----------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: flowerschoice_prometheus
    profiles:
      - monitoring
    depends_on:
      - backend
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

volumes:
  prometheus_data:
