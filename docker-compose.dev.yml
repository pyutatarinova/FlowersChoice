version: "3.9"

services:
  db:
    ports:
      - "${DB_PORT}:5432"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  backend:
    ports:
      - "3001:3001"

  frontend:
    image: node:20
    container_name: plants_frontend_dev
    working_dir: /app
    environment:
      VITE_SITE_URL: ${SITE_URL}
      VITE_API_BASE_URL: ${SITE_URL}
      VITE_DEV_API_PROXY_TARGET: http://backend:3001
      VITE_DEV_MINIO_PROXY_TARGET: http://minio:9000
      VITE_DEV_MINIO_CONSOLE_PROXY_TARGET: http://minio:9001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
